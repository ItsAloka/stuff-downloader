[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stuff-downloader"
version = "0.0.1"
description = "Private local Windows desktop downloader (M0 foundation)."
readme = "readme.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PyQt6==6.11.0",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.6,<1",
]

[project.scripts]
stuff-downloader = "stuff_downloader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyqt6"
markers = ["network: needs real network access (run manually)"]
addopts = "-m 'not network'"
